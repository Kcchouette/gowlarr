linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - gofmt

linters-settings:
  errcheck:
    check-blank: true
  govet:
    disable:
      - fieldalignment
    enable-all: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - linters:
        - govet
      text: "shadow"
    - linters:
        - errcheck
      text: "tx\\.Rollback"
    - linters:
        - errcheck
      text: "config\\.Path"
    - linters:
        - errcheck
      text: "strconv\\."
